name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      online:
        description: "Also run the online tests (Crossref, OpenAlex, arXiv)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    name: offline (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every script
        run: python -m compileall -q lib skills tests
      - name: Offline tests
        run: python tests/run_tests.py -v

  online:
    name: online (Crossref, OpenAlex, arXiv)
    if: github.event_name == 'workflow_dispatch' && inputs.online
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Online tests
        run: python tests/run_tests.py --online -v
